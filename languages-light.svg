<svg xmlns="http://www.w3.org/2000/svg" width="450" height="219" viewBox="0 0 400 195" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Most used languages</title>
<desc id="desc">JavaScript 27.1%, Java 22.7%, HTML 15.5%, TypeScript 15.1%, Python 9.3%, Other 10.2%</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #1f2328; }
  .label { font-size: 14px; }
  .value { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .small { font-size: 12px; }
  .col { font-size: 11px; fill: #818b98; letter-spacing: 0.04em; }
  .secondary { fill: #59636e; }
  .muted { fill: #818b98; }
  .icon { fill: #59636e; }
  .fade { animation: fade 0.45s ease-out both; }
  .grow { transform-box: fill-box; transform-origin: left center; animation: grow 0.9s cubic-bezier(.2,.7,.2,1) 0.15s both; }
  .ring { animation: ring 1.2s cubic-bezier(.2,.7,.2,1) 0.2s both; }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop 0.4s ease-out 0.5s both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes pop { from { opacity: 0; transform: scale(0.6); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0.5" y="0.5" width="399" height="194" rx="6" fill="none" stroke="none"/>
<text x="20" y="28" class="col">MOST USED LANGUAGES</text>
<mask id="bar"><rect class="grow" x="20" y="48" width="360" height="10" rx="5" fill="#fff"/></mask>
<g mask="url(#bar)"><rect x="20.00" y="48" width="95.01" height="10" fill="#f1e05a"/><rect x="117.01" y="48" width="79.43" height="10" fill="#b07219"/><rect x="198.45" y="48" width="54.19" height="10" fill="#e34c26"/><rect x="254.63" y="48" width="52.96" height="10" fill="#3178c6"/><rect x="309.59" y="48" width="32.58" height="10" fill="#3572A5"/><rect x="344.17" y="48" width="35.83" height="10" fill="#8c959f"/></g>
<g transform="translate(20 84)"><g class="fade" style="animation-delay: 200ms"><circle cx="5" cy="6" r="5" fill="#f1e05a"/><text x="16" y="11" class="label">JavaScript <tspan class="secondary">27.1%</tspan></text></g></g>
<g transform="translate(200 84)"><g class="fade" style="animation-delay: 270ms"><circle cx="5" cy="6" r="5" fill="#b07219"/><text x="16" y="11" class="label">Java <tspan class="secondary">22.7%</tspan></text></g></g>
<g transform="translate(20 116)"><g class="fade" style="animation-delay: 340ms"><circle cx="5" cy="6" r="5" fill="#e34c26"/><text x="16" y="11" class="label">HTML <tspan class="secondary">15.5%</tspan></text></g></g>
<g transform="translate(200 116)"><g class="fade" style="animation-delay: 410ms"><circle cx="5" cy="6" r="5" fill="#3178c6"/><text x="16" y="11" class="label">TypeScript <tspan class="secondary">15.1%</tspan></text></g></g>
<g transform="translate(20 148)"><g class="fade" style="animation-delay: 480ms"><circle cx="5" cy="6" r="5" fill="#3572A5"/><text x="16" y="11" class="label">Python <tspan class="secondary">9.3%</tspan></text></g></g>
<g transform="translate(200 148)"><g class="fade" style="animation-delay: 550ms"><circle cx="5" cy="6" r="5" fill="#8c959f"/><text x="16" y="11" class="label">Other <tspan class="secondary">10.2%</tspan></text></g></g>
</svg>
